technologies_to_learn:
  - The Software Development Lifecycle (SDLC), every stage and its steps
  - AI-first development, stage by stage
  - Discovery from many sources (call transcripts, emails, messages, spreadsheets)
  - Requirements and acceptance criteria
  - Auditing and cleaning messy spreadsheet data
  - Simple architecture and data modelling
  - Dashboards and centralised reporting
  - UI design with Claude Design
  - Directing a coding agent (Claude Code or equivalent)
  - AI context management and token use
  - Testing (unit, integration, UI with Playwright, edge cases, regression, UAT)
  - Environment variables and keeping secrets out of Git
  - GitHub Actions (a basic automatic check)
  - Git and GitHub (template repositories, commits, collaborator access)
  - Loom screen recording
